<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Support Assistant</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Order Support Assistant</h1>
  <p class="subtitle">Ask about an order status or tracking - try "Where's my order ORD-1001?"</p>

  <div id="chat"></div>

  <form id="chat-form">
    <input id="chat-input" type="text" placeholder="Ask about your order..." autocomplete="off" required />
    <button type="submit">Send</button>
  </form>

  <script src="app.js"></script>
</body>
</html>
