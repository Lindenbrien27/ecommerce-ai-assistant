services:
  - type: web
    name: ecommerce-ai-assistant
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # The container's own CMD (doppler run -- node server.js) fetches
      # ANTHROPIC_API_KEY, DATABASE_URL, and JWT_SECRET from Doppler at
      # startup - this is the only secret Render itself needs to hold.
      - key: DOPPLER_TOKEN
        sync: false