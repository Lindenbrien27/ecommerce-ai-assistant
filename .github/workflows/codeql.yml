name: CodeQL

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  schedule:
    # Catches newly-published CodeQL query coverage against code that
    # hasn't changed - the same reasoning as running `npm audit` on a
    # schedule in ci.yml: a query that didn't exist last week can still
    # find something real in a file nobody touched today.
    - cron: '17 3 * * 1'

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      # JS/TS is interpreted, not compiled - CodeQL extracts directly from
      # source, so there's no build step to run here (unlike a compiled
      # language, where init would need an autobuild/manual-build step
      # between init and analyze).
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
