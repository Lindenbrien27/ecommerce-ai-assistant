name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm --prefix frontend test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ecommerce-ai-assistant:ci .

  e2e:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://e2e:e2e@localhost:5432/e2e
      JWT_SECRET: e2e-test-secret
      # No real key - e2e/chat.spec.js asserts on the graceful-failure path,
      # which is deterministic and doesn't cost anything to run on every push.
      ANTHROPIC_API_KEY: e2e-fake-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # --audit-level=critical: the full report always prints regardless of
      # this flag, but only a critical finding fails the build. Moderate/high
      # findings often depend on how a package is actually used (e.g. a dev
      # -server-only issue, or one gated behind an unstable API we don't
      # import) and need a human to judge applicability, not an automatic
      # block - critical is reserved for advisories that are exploitable
      # essentially regardless of context.
      - name: Audit backend dependencies
        run: npm audit --audit-level=critical
      - run: npm --prefix frontend ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=critical
        working-directory: frontend
