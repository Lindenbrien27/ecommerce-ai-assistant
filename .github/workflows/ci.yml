name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm --prefix frontend test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ecommerce-ai-assistant:ci .
      - name: Verify the container runs as a non-root user
        run: |
          actual="$(docker run --rm --entrypoint id ecommerce-ai-assistant:ci -u)"
          echo "container uid: $actual"
          if [ "$actual" = "0" ]; then
            echo "::error::Container is running as root (uid 0) - USER node in the Dockerfile isn't taking effect"
            exit 1
          fi
      # No real DOPPLER_TOKEN is available here (it's the user's own Doppler
      # account) - this proves the real CMD path runs cleanly as the non-root
      # user up to the point where it legitimately needs one, rather than
      # failing on a permission error the hardening change could've caused.
      - name: Verify the real CMD fails only on the expected missing-token error
        run: |
          output="$(docker run --rm ecommerce-ai-assistant:ci 2>&1 || true)"
          echo "$output"
          if ! echo "$output" | grep -q "Doppler Error: you must provide a token"; then
            echo "::error::Container didn't fail with the expected Doppler auth error - it may be failing for an unrelated (e.g. permission) reason instead"
            exit 1
          fi

  e2e:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://e2e:e2e@localhost:5432/e2e
      JWT_SECRET: e2e-test-secret
      # No real key - e2e/chat.spec.js asserts on the graceful-failure path,
      # which is deterministic and doesn't cost anything to run on every push.
      ANTHROPIC_API_KEY: e2e-fake-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  dast:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://e2e:e2e@localhost:5432/e2e
      JWT_SECRET: e2e-test-secret
      ANTHROPIC_API_KEY: e2e-fake-key
      PORT: 3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start the app in the background
        run: |
          node server.js &
          ready=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::Server never became healthy"
            exit 1
          fi
      # Passive baseline scan (spidering + passive analysis, no active
      # exploitation attempts) against the real running app - not a
      # substitute for the header/CSP-specific assertions already in
      # test/securityHeaders.test.js, but those only check the headers this
      # app sets deliberately; this checks what a scanner sees end-to-end,
      # including anything nobody thought to write an assertion for.
      # Report-only for now (fail_action: false) - see README > Dynamic
      # scanning for why, same reasoning as npm audit not hard-failing on
      # every finding regardless of severity/applicability.
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
          fail_action: false
          allow_issue_writing: false

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # --audit-level=critical: the full report always prints regardless of
      # this flag, but only a critical finding fails the build. Moderate/high
      # findings often depend on how a package is actually used (e.g. a dev
      # -server-only issue, or one gated behind an unstable API we don't
      # import) and need a human to judge applicability, not an automatic
      # block - critical is reserved for advisories that are exploitable
      # essentially regardless of context.
      - name: Audit backend dependencies
        run: npm audit --audit-level=critical
      - run: npm --prefix frontend ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=critical
        working-directory: frontend
